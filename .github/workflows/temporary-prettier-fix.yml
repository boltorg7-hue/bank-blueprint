name: Temporary Prettier repair

on:
  push:
    branches:
      - "fix/auth-email-confirmation-onboarding-resume"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format only the three linted files
        run: bunx prettier --write src/routes/index.tsx src/routes/email-verified.tsx tests/auth-registration-certification.test.mjs
      - name: Commit formatted files
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/routes/index.tsx src/routes/email-verified.tsx tests/auth-registration-certification.test.mjs
            git commit -m "style: apply Prettier formatting to changed files"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "All targeted files are already formatted."
          fi
