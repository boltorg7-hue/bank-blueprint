name: Temporary Prettier repair

on:
  push:
    branches:
      - "fix/certification-regex-escaping"

permissions:
  contents: write

concurrency:
  group: prettier-repair-{{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Format only files reported by CI
        run: |
          npx prettier --write \
            src/components/navigation/CustomerSidebar.tsx \
            src/components/ui/button.tsx \
            src/components/ui/form.tsx \
            src/features/notifications/components/NotificationCenter.tsx \
            src/features/onboarding/services/onboarding.server.ts \
            src/features/transfers/components/TransferWizard.tsx \
            src/features/transfers/hooks/useTransfers.ts \
            src/features/transfers/services/transfers.functions.ts \
            src/features/transfers/services/transfers.server.ts \
            src/features/transfers/utils/transfer-display.ts \
            src/routes/app.beneficiaries.tsx \
            src/routes/contact.tsx
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/navigation/CustomerSidebar.tsx \
            src/components/ui/button.tsx \
            src/components/ui/form.tsx \
            src/features/notifications/components/NotificationCenter.tsx \
            src/features/onboarding/services/onboarding.server.ts \
            src/features/transfers/components/TransferWizard.tsx \
            src/features/transfers/hooks/useTransfers.ts \
            src/features/transfers/services/transfers.functions.ts \
            src/features/transfers/services/transfers.server.ts \
            src/features/transfers/utils/transfer-display.ts \
            src/routes/app.beneficiaries.tsx \
            src/routes/contact.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git commit -m "style: apply Prettier to CI-reported files"
          git push origin "HEAD:${{ github.ref_name }}"
