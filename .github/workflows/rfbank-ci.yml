name: RF BANK CI

on:
  push:
    branches:
      - main
      - "fix/**"
      - "chore/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rfbank-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certification:
    name: Certification tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run certification tests
        run: bun run test:certification

  lint:
    name: Lint changed JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint changed files
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git fetch origin "$GITHUB_BASE_REF"
            changed_files=$(git diff --name-only --diff-filter=ACMRT "origin/$GITHUB_BASE_REF"...HEAD)
          else
            changed_files=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
          fi

          mapfile -t files < <(printf '%s\n' "$changed_files" | grep -E '\.(js|jsx|ts|tsx|mjs|cjs)$' || true)

          if (( ${#files[@]} == 0 )); then
            echo "No changed JavaScript/TypeScript files to lint."
            exit 0
          fi

          printf 'Linting %s changed file(s):\n' "${#files[@]}"
          printf ' - %s\n' "${files[@]}"
          bunx eslint "${files[@]}"

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build application
        run: bun run build
