name: RF BANK PR 72 formatting repair

on:
  push:
    branches:
      - feat/auth-onboarding-modernization

permissions:
  contents: write

jobs:
  format:
    name: Format changed JavaScript and TypeScript files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply repository Prettier rules to PR files
        shell: bash
        run: |
          git fetch origin main
          mapfile -t files < <(git diff --name-only --diff-filter=ACMRT origin/main...HEAD | grep -E '\\.(js|jsx|ts|tsx|mjs|cjs)$' || true)

          if (( ${#files[@]} == 0 )); then
            echo "No changed JavaScript/TypeScript files to format."
            exit 0
          fi

          printf 'Formatting %s changed file(s):\\n' "${#files[@]}"
          bunx prettier --write "${files[@]}"

          if git diff --quiet; then
            echo "All changed files already match Prettier."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "style: format PR 72 changed files [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
