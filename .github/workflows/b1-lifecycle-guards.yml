name: B1 lifecycle guard checks

on:
  push:
    branches:
      - fix/b1-lifecycle-transition-guards
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b1-lifecycle-guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Certification, build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run certification tests
        run: node --test tests/certification.test.mjs tests/admin-ui-certification.test.mjs

      - name: Build application
        if: always()
        run: npm run build

      - name: Run scoped B1 lint (excluding repository-wide formatting debt)
        if: always()
        run: >-
          npx eslint
          src/features/onboarding/services/onboarding.server.ts
          scripts/audit-migration-functions.mjs
          tests/certification.test.mjs
          tests/step-09-international-phone-otp-flow.test.mjs
          tests/step-10-admin-customer-service-migration.test.mjs
          --rule 'prettier/prettier: off'

      - name: Report repository-wide lint baseline
        if: always()
        continue-on-error: true
        run: npm run lint
